<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Resume for Takeru Hiura." />
  <meta name="theme-color" content="#07111f" />
  <title>Takeru Hiura | Resume</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>
  <header class="site-header" id="top">
    <nav class="nav container" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Takeru Hiura home">TH<span>.</span></a>
      <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="experience.html">Experience</a>
        <a href="projects.html">Projects</a>
        <a href="education.html">Education</a>
        <a href="resume.html" aria-current="page">Resume</a>
      </div>
    </nav>
  </header>

  <main class="subpage-main">
    <section class="subpage-hero container reveal">
      <p class="section-kicker">Resume</p>
      <h1>Resume</h1>
      <p class="subpage-intro">View the latest PDF version here or open it in a new tab for downloading.</p>
      <div class="resume-actions">
        <a class="button primary" href="/Takeru_Hiura_Resume.pdf" target="_blank" rel="noreferrer">Open PDF <span>↗</span></a>
      </div>
    </section>

    <section class="section container reveal">
      <div class="resume-layout">
        <div class="resume-embed">
          <iframe src="/Takeru_Hiura_Resume.pdf" title="Takeru Hiura Resume PDF"></iframe>
        </div>
      </div>
    </section>
  </main>

<script>
  const navToggle = document.querySelector('.nav-toggle');
  const navLinks = document.querySelector('.nav-links');

  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const expanded = navToggle.getAttribute('aria-expanded') === 'true';
      navToggle.setAttribute('aria-expanded', String(!expanded));
      navLinks.classList.toggle('active');
    });

    navLinks.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }
</script>

</body>
</html>
